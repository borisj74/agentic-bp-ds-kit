<!-- A served screen, cut down to what the live check reads: the name tags and the landmarks. -->
<!doctype html>
<html lang="en">
  <body>
    <div data-bp-kit="AppShell" class="shell">
      <header data-bp-kit="AppHeader">
        <span data-bp-kit="Logo">Agentic BP</span>
        <nav data-bp-kit="AppNav" aria-label="Sections"></nav>
      </header>
      <main>
        <section data-bp-kit="ListPage">
          <header data-bp-kit="PageHeader">
            <nav data-bp-kit="Breadcrumb" aria-label="Breadcrumb"></nav>
            <h1>Invoices</h1>
            <button data-bp-kit="Button" type="button">New invoice</button>
          </header>
          <div data-bp-kit="Toolbar">
            <div data-bp-kit="Input"></div>
            <button data-bp-kit="Button" type="button">Filter</button>
          </div>
          <div data-bp-kit="Table">
            <span data-bp-kit="HeaderCell">Number</span>
            <span data-bp-kit="Cell">INV-1001</span>
            <span data-bp-kit="Cell">INV-1002</span>
            <span data-bp-kit="Badge">Paid</span>
          </div>
          <div data-bp-kit="Pagination"></div>
        </section>
      </main>
    </div>
  </body>
</html>
